name: Live Top Gainers Scan

# NOTE: native GitHub `schedule:` was tested and proved unreliable -
# on 21-Jul-2026, runs meant to fire every 30 min instead fired at
# 06:25, 09:08, 11:22 UTC (gaps of 1h43m and 2h13m). Removed the
# schedule trigger; this is now dispatched externally via cron-job.org,
# same reliable pattern used for the other Claudeown workflows.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gainers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run top gainers scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python top_gainers_scanner.py

      - name: Commit enrichment cache, with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain enrichment_cache_topgainers.json 2>/dev/null)" ]; then
            echo "No cache changes to commit."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git add enrichment_cache_topgainers.json
            git commit -m "Update top gainers enrichment cache [automated]" || true
            if git push; then
              echo "Pushed successfully on attempt $attempt"
              exit 0
            fi
            sleep $((RANDOM % 5 + 1))
            git pull --rebase
          done
          echo "WARNING: could not push after 5 attempts"
