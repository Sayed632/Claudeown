name: Steady Climber Scan

# Dispatch-only from the start (native GitHub schedule proved unreliable
# for other frequent workflows in this repo). Trigger externally via
# cron-job.org, once daily after market close. Scans the full Nifty 500
# (493 stocks) so expect a similar runtime to Penny Stock scanner
# (~9-16 min) - this is a trend-following screen, not intraday, so
# once-daily is intentional, not a compromise.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  steady_climber_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run steady climber scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python steady_climber_scanner.py

      - name: Commit enrichment cache, with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain enrichment_cache_steadyclimber.json 2>/dev/null)" ]; then
            echo "No cache changes to commit."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git add enrichment_cache_steadyclimber.json
            git commit -m "Update steady climber enrichment cache [automated]" || true
            if git push; then
              echo "Pushed successfully on attempt $attempt"
              exit 0
            fi
            sleep $((RANDOM % 5 + 1))
            git pull --rebase
          done
          echo "WARNING: could not push after 5 attempts"
