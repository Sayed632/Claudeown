name: Penny/Small-Cap Speculative Mover Scan

# Dispatch-only from the start (native GitHub schedule proved unreliable
# for every other frequent workflow in this repo). Trigger externally
# via cron-job.org, once daily after market close - this scans the FULL
# ~2,200-stock NSE universe in Stage 1, so it's intentionally NOT a
# high-frequency intraday scan like Early Volume; a 5-day surge + red
# flags pattern doesn't need to be checked every few minutes.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  penny_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run penny/small-cap scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python penny_stock_scanner.py

      - name: Commit enrichment cache, with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain enrichment_cache_pennystock.json 2>/dev/null)" ]; then
            echo "No cache changes to commit."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git add enrichment_cache_pennystock.json
            git commit -m "Update penny stock enrichment cache [automated]" || true
            if git push; then
              echo "Pushed successfully on attempt $attempt"
              exit 0
            fi
            sleep $((RANDOM % 5 + 1))
            git pull --rebase
          done
          echo "WARNING: could not push after 5 attempts"
