name: Framework Research - Capture Snapshot

on:
  schedule:
    # 1st of each month at 9 AM IST (3:30 AM UTC)
    - cron: '30 3 1 * *'
  workflow_dispatch:

jobs:
  capture_snapshot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Capture market snapshot
        run: |
          python framework_research/automation/capture_snapshot.py

      - name: Verify snapshot files created
        run: |
          echo "Checking snapshot files..."
          ls -la framework_research/data/snapshots/ || echo "No snapshots yet"

      - name: Configure git
        run: |
          git config user.name "Framework Research Bot"
          git config user.email "research@claudeown.local"

      - name: Commit and push snapshot
        run: |
          git add framework_research/data/snapshots/
          git commit -m "🔬 Framework Research: Monthly snapshot - $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push

      - name: Create summary
        if: success()
        run: |
          echo "✅ Snapshot captured successfully"
          echo "📅 Date: $(date)"
          echo "📁 Snapshots:"
          ls -1 framework_research/data/snapshots/ 2>/dev/null | tail -3
